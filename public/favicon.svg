<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="nt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="nt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#nt-grad)" />
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- NT Monogram -->
  <text
    x="64"
    y="84"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="58"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-1.5"
    filter="url(#nt-shadow)"
  >NT</text>
</svg>
